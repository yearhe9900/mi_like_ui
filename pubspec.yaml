name: mi_like_ui
description: "Xiaomi-style (HyperOS design language) Flutter UI component library — glass navigation bars, collapsing top bar, search field, dialog and more, with pixel-accurate design specs, dark/light themes and responsive layout."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
